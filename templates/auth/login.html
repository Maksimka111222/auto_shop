{% extends "base.html" %}

{% block title %}Вхід{% endblock %}

{% block content %}
<section class="mx-auto max-w-md bg-white rounded-xl shadow p-6 md:p-8">
    <h1 class="text-2xl font-bold mb-6">Вхід</h1>
    <form method="post" class="space-y-4">
        <!-- next: куди повернутися після входу (наприклад, в адмін-панель) -->
        <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
        <div>
            <label for="email" class="block font-semibold mb-1">Email</label>
            <input id="email" name="email" type="email" required value="{{ email }}" autocomplete="email"
                   class="w-full rounded-lg border border-zinc-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-500">
        </div>
        <div>
            <label for="password" class="block font-semibold mb-1">Пароль</label>
            <input id="password" name="password" type="password" required autocomplete="current-password"
                   class="w-full rounded-lg border border-zinc-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-500">
        </div>
        <button type="submit" class="w-full rounded-lg bg-red-600 px-6 py-2 font-semibold text-white hover:bg-red-700 cursor-pointer">Увійти</button>
    </form>
    <p class="mt-6 text-zinc-600">Немає облікового запису?
        <a href="{{ url_for('auth.register') }}" class="font-semibold text-red-600 underline">Зареєструватися</a>
    </p>
</section>
{% endblock %}
