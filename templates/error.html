{% extends "base.html" %}

{% block title %}Помилка {{ code }}{% endblock %}

{% block content %}
<section class="mx-auto max-w-xl bg-white rounded-xl shadow p-8 text-center">
    <p class="text-6xl font-extrabold text-red-600 mb-2">{{ code }}</p>
    <h1 class="text-2xl font-bold mb-3">{{ title }}</h1>
    <p class="text-zinc-600 mb-6">{{ message }}</p>
    <a href="{{ url_for('home') }}" class="rounded-lg bg-zinc-900 px-5 py-2 font-semibold text-white hover:bg-red-600">На головну</a>
</section>
{% endblock %}
